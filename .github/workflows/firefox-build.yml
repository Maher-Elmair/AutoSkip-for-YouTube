name: Firefox build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:firefox
      - run: npm run test:firefox-build
      - uses: actions/upload-artifact@v4
        with:
          name: autoskip-firefox
          path: dist-firefox/
          if-no-files-found: error
